# Route protected by standalone ext-auth apiKeyAuth (plain AuthConfig, no Portal).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apikey-example-com
  namespace: httpbin
spec:
  parentRefs:
    - name: gw
      namespace: ingress-gw
  hostnames:
    - "apikey.example.com"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: httpbin
        port: 8000
