# Route exposed as a Portal ApiProduct and protected by portalAuth in apiKey mode.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-example-com
  namespace: httpbin
spec:
  parentRefs:
    - name: gw
      namespace: ingress-gw
  hostnames:
    - "portal.example.com"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: httpbin
        port: 8000
